name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "main" ]

jobs:
  laravel-tests:
    name: PHP ${{ matrix.php }}, ${{ matrix.plugins }} plugins
    runs-on: ubuntu-latest
    # A newer PHP than production runs is an early warning, not a blocker.
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        plugins: ['bundled', 'composer']
        experimental: [false]
        include:
          - php: '8.5'
            plugins: 'composer'
            experimental: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, bcmath, sqlite, intl, pdo_sqlite, gd
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-${{ matrix.plugins }}-composer-${{ hashFiles('tracker-app/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-${{ matrix.plugins }}-composer-

      - name: Install Composer Dependencies
        working-directory: ./tracker-app
        run: composer install --no-interaction --prefer-dist --no-progress

      # "bundled" checks the app and its tests work without the packages plugins bring;
      # "composer" installs the bundled plugins' packages so their own tests run too.
      - name: Install the bundled plugins' packages
        if: matrix.plugins == 'composer'
        working-directory: ./tracker-app
        run: |
          PACKAGES="$(php -r 'foreach (glob("plugins/*/composer.json") as $file) {
              foreach (json_decode(file_get_contents($file), true)["require"] ?? [] as $name => $version) {
                  if (str_contains($name, "/")) { echo "{$name}:{$version} "; }
              }
          }')"
          composer require $PACKAGES --no-interaction --no-progress --no-scripts

      - name: Generate application key
        working-directory: ./tracker-app
        run: echo "APP_KEY=$(php artisan key:generate --show)" >> "$GITHUB_ENV"

      - name: Run Tests
        working-directory: ./tracker-app
        env:
          TERM: xterm
        run: |
          # Run the test suite
          composer test:ci

  js-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tracker-app/package-lock.json

      - name: Install npm Dependencies
        working-directory: ./tracker-app
        run: npm ci

      - name: Run JS Tests
        working-directory: ./tracker-app
        run: npm test
