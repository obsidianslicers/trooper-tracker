name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "main" ]

jobs:
  laravel-tests:
    name: PHP ${{ matrix.php }}, ${{ matrix.plugins }} plugins${{ matrix.pint && ', code style' || '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Production runs PHP 8.5.
          - php: '8.5'
            plugins: 'bundled'
            pint: true
          - php: '8.5'
            plugins: 'composer'
            pint: false
          # Older PHP still supported by composer.json.
          - php: '8.4'
            plugins: 'composer'
            pint: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, bcmath, sqlite, intl, pdo_sqlite, gd
          coverage: none

      # Only Composer's download cache is kept; vendor is always installed fresh,
      # because each job installs a different set of plugin packages into it.
      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.plugins }}-${{ hashFiles('tracker-app/composer.lock', 'tracker-app/plugins/*/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        id: composer-install
        working-directory: ./tracker-app
        run: composer install --no-interaction --prefer-dist --no-progress

      # "bundled" checks the app and its tests work without the packages plugins bring;
      # "composer" installs the bundled plugins' packages so their own tests run too.
      - name: Install the bundled plugins' packages
        if: matrix.plugins == 'composer'
        working-directory: ./tracker-app
        run: |
          PACKAGES="$(php -r 'foreach (glob("plugins/*/composer.json") as $file) {
              foreach (json_decode(file_get_contents($file), true)["require"] ?? [] as $name => $version) {
                  if (str_contains($name, "/")) { echo "{$name}:{$version} "; }
              }
          }')"
          composer require $PACKAGES --no-interaction --no-progress --no-scripts

      - name: Generate application key
        working-directory: ./tracker-app
        run: echo "APP_KEY=$(php artisan key:generate --show)" >> "$GITHUB_ENV"

      - name: Run Tests
        working-directory: ./tracker-app
        env:
          TERM: xterm
        run: composer test:ci

      # Runs even when the tests fail, so a style problem is reported alongside them.
      - name: Check code style (Pint)
        if: >-
          matrix.pint && (success() || failure())
          && steps.composer-install.outcome == 'success'
        working-directory: ./tracker-app
        run: composer pint:test

  e2e-tests:
    name: Browser and JS tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, sqlite, intl, pdo_sqlite, gd
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tracker-app/package-lock.json

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-bundled-${{ hashFiles('tracker-app/composer.lock', 'tracker-app/plugins/*/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        working-directory: ./tracker-app
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm Dependencies
        id: npm-install
        working-directory: ./tracker-app
        run: npm ci

      - name: Build front-end assets
        working-directory: ./tracker-app
        run: npm run build

      - name: Install Playwright browser
        working-directory: ./tracker-app
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: ./tracker-app
        run: npm run test:e2e

      # Runs even when an earlier step fails, as long as npm packages installed.
      - name: Run JS tests (Vitest)
        if: (success() || failure()) && steps.npm-install.outcome == 'success'
        working-directory: ./tracker-app
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tracker-app/playwright-report
            tracker-app/test-results
          retention-days: 7
