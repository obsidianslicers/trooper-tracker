name: Code Style (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "main" ]

jobs:
  pint-test:
    runs-on: ubuntu-latest

    steps:
      # Call the reusable workflow
      - name: Install PHP + Composer
        uses: ./.github/workflows/composer-install.yml
        with:
          php_version: '8.2'
          working_directory: './tracker-app'  

      - name: Run Pint in test mode
        working-directory: ./tracker-app
        run: |
          ./vendor/bin/pint app/helpers.php --test
          ./vendor/bin/pint app/Bus --test
          ./vendor/bin/pint app/Jobs --test
          ./vendor/bin/pint app/Mail --test
          ./vendor/bin/pint app/Policies --test
          ./vendor/bin/pint app/Rules --test
